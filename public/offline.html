<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>غير متصل | ServisGo</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0f2157;
        color: #e2e8f0;
        font-family: 'Noto Sans Arabic', 'Segoe UI', system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 380px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        padding: 32px 24px;
      }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 20px; margin: 18px 0 8px; color: #fff; }
      p { font-size: 14px; line-height: 1.7; color: #94a3b8; margin: 0 0 6px; }
      .en { direction: ltr; font-family: 'Segoe UI', system-ui, sans-serif; }
      button {
        margin-top: 20px;
        background: #f59e0b;
        color: #422006;
        border: 0;
        border-radius: 12px;
        padding: 11px 22px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="ServisGo" />
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>التطبيق مثبّت ويعمل، لكن تحميل البيانات يحتاج اتصالاً. أعد المحاولة عند عودة الشبكة.</p>
      <p class="en">You are offline. ServisGo is installed and ready — it just needs a connection to load your data.</p>
      <button onclick="location.replace('/')">إعادة المحاولة · Retry</button>
    </div>
  </body>
</html>
